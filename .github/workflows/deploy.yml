# Deployed (2026-09-19/20, this run) to the `andy-oneforce/braincore-website`
# repo ROOT at `.github/workflows/deploy.yml`, on `main`. This is the version
# that actually ran and went green (run 35478027930) — kept here for
# provenance/parity with what is live, not just a stage.
#
# GitHub only reads a workflow from a repo's own `.github/workflows/`, so the
# copy that actually runs must live at that repo's root, not inside
# asios-platform-dev's APP/website-build/code/.github/ (see that file for the
# asios-platform-dev-side build check, which this mirrors for the deploy leg).
#
# The site repo root is NOT flat — it mirrors `APP/website-build/` (code/'s
# PARENT), i.e. two top dirs: `code/` (build.mjs, package.json, src/, …) and
# `data/asios/` (content/ + site.config.json, no dist/ — regenerated by CI).
# This is required: `build.mjs`'s CONTENT_DIR/DIST_DIR and `head.mjs`'s
# SITE_CONFIG_PATH are computed relative to build.mjs's own directory via
# `../data/asios/...` — a flat repo root (just `code/`'s contents at root,
# per this file's original 2026-09-19 draft) resolves that data path OUTSIDE
# the repo and silently builds an empty site (missing-dir reads return `[]`,
# no error). Verified locally end-to-end with this exact two-dir layout
# before the first push (docs/marketing/blog pages, sitemap, robots.txt,
# Pagefind index all generated correctly).
#
# Publish step mirrors deploy-github-pages.py's `--mode branch` (orphan
# commit, force-pushed to gh-pages) but does it in-place with the run's own
# GITHUB_TOKEN instead of a cross-repo deploy SSH key, since this workflow
# pushes to the SAME repo it builds in rather than a separate target repo.
# It also writes a `CNAME` file (braincore.ai) into the orphan commit —
# build.mjs does not produce one, and the prior gh-pages branch carried it;
# omitting it would have dropped the custom-domain/HTTPS cert association.

name: Website Build & Deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - run: node link-check.mjs
      - run: node lighthouse-ci.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - run: node build.mjs
        working-directory: code
      - name: Publish dist/ to gh-pages (orphan commit, force-push — mirrors deploy-github-pages.py --mode branch)
        run: |
          work_dir=$(mktemp -d)
          cp -r data/asios/dist/. "$work_dir"/
          echo "braincore.ai" > "$work_dir/CNAME"
          cd "$work_dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan gh-pages
          git add -A
          git commit -q -m "Deploy $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
